<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub — Fresh, Fired, Feasted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
 
/* ============ TOKENS ============ */
:root{
  --ink:#1c1410;
  --paper:#fbf3e7;
  --paper-2:#f3e6d3;
  --saffron:#e7a93f;
  --saffron-soft:#f2c876;
  --chili:#b23a2e;
  --chili-dark:#8a2b22;
  --maroon:#3f131c;
  --sage:#74915b;
  --line: rgba(28,20,16,0.16);
  --line-light: rgba(251,243,231,0.22);
 
  --display: "Fraunces", serif;
  --body: "Space Grotesk", sans-serif;
  --mono: "Space Mono", monospace;
 
  --container: 1180px;
  --radius: 18px;
}
 
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family: var(--body);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.55;
  overflow-x: hidden;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
h1,h2,h3{font-family: var(--display); font-weight:600; line-height:1.05;}
.wrap{max-width: var(--container); margin: 0 auto; padding: 0 28px;}
.eyebrow{
  font-family: var(--mono);
  font-size: 12.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display:inline-flex;
  align-items:center;
  gap:8px;
  color: var(--chili);
  margin-bottom: 14px;
}
.eyebrow::before{
  content:"";
  width:16px; height:1.5px;
  background: var(--chili);
  display:inline-block;
}
.btn{
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  display:inline-flex;
  align-items:center;
  gap: 10px;
  padding: 15px 30px;
  border-radius: 999px;
  border: 1.5px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  cursor:pointer;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, background .35s ease, color .35s ease;
  box-shadow: 0 0 0 0 rgba(178,58,46,0);
}
.btn:hover{
  transform: translateY(-3px);
  box-shadow: 0 14px 26px -12px rgba(28,20,16,0.45);
}
.btn.ghost{
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn.chili{
  background: var(--chili);
  border-color: var(--chili);
  color: var(--paper);
}
.btn.chili:hover{ background: var(--chili-dark); border-color: var(--chili-dark); }
.btn.whatsapp{
  background: var(--sage);
  border-color: var(--sage);
  color: var(--paper);
}
.btn.whatsapp:hover{ box-shadow: 0 14px 26px -12px rgba(74,22,32,0.45); filter: brightness(1.06); }
 
/* reveal-on-scroll */
.reveal{ opacity:0; transform: translateY(26px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
.reveal.in{ opacity:1; transform: translateY(0); }
.reveal-stagger > *{ transition-delay: calc(var(--i,0) * 90ms); }
 
@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
  html{ scroll-behavior:auto; }
  .reveal{ opacity:1; transform:none; }
}
 
/* ============ NAV ============ */
